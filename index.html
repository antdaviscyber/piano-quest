<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano Quest</title>
<style>
:root{
  --bg:#0b1028;--bg2:#121a3d;--card:#1a2350;--card2:#232f68;--line:#2e3c80;
  --ink:#eef2ff;--mute:#9fb0e6;--amber:#ffb020;--amber2:#ff8a00;
  --teal:#2dd4bf;--violet:#a78bfa;--green:#34d399;--red:#f87171;--blue:#60a5fa;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 10% -10%,#223070 0%,var(--bg) 60%);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{display:flex;flex-direction:column;height:100%}
header#top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(10,15,40,.85);
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);flex:0 0 auto}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo span{background:linear-gradient(90deg,var(--amber),#ff6a88);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;margin-left:10px;flex:1}
nav button{background:transparent;border:0;padding:8px 14px;border-radius:999px;color:var(--mute);font-weight:600}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:var(--card2);color:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#6b7280}
.chip.ok .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.bad .dot{background:var(--red)}
.chip.flash .dot{background:var(--amber);box-shadow:0 0 10px var(--amber)}
#profBtn{font-size:15px}
main#view{flex:1 1 auto;overflow:auto;position:relative}
.page{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
.btn{background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#2a1700;border:0;box-shadow:0 6px 18px rgba(255,140,0,.35)}
.btn.ghost{background:transparent}
.btn.danger{background:#7f1d1d;border-color:#b91c1c}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px;
  background:linear-gradient(120deg,#2a3a8f,#4b2a8f);border-radius:20px;padding:20px 22px;border:1px solid #4553b3}
.hero h1{font-size:26px}
.hero p{color:#cbd5ff;margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 14px;text-align:center;min-width:76px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:#c7d2fe}
.level{margin-bottom:26px}
.lvhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.lvemoji{font-size:34px;width:56px;height:56px;border-radius:16px;background:var(--card2);display:grid;place-items:center}
.lvhead h2{font-size:19px}
.lvhead p{color:var(--mute);font-size:14px;margin-top:2px}
.lvprog{margin-left:auto;font-weight:700;color:var(--amber)}
.path{display:flex;flex-wrap:wrap;gap:12px}
.bubble{width:150px;min-height:128px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;text-align:center;transition:transform .12s}
.bubble:hover:not(.locked){transform:translateY(-3px);border-color:var(--amber)}
.bubble .bnum{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,var(--teal),#0ea5a0);color:#06322f;font-weight:800;display:grid;place-items:center;font-size:18px}
.bubble .btitle{font-size:14px;font-weight:700;line-height:1.2}
.bubble .bstars{font-size:20px;letter-spacing:2px;color:#475089}
.bstars i{font-style:normal;color:#475089}
.bstars i.on{color:var(--amber);text-shadow:0 0 8px rgba(255,176,32,.6)}
.bubble.locked{opacity:.45;cursor:not-allowed}
.bubble.locked .bnum{background:#3b4373;color:#aab}
.bubble.next{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.songcard{display:flex;flex-direction:column;gap:8px}
.songcard h3{font-size:17px}
.songcard small{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse}
.table td,.table th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
.table th{color:var(--mute);font-size:13px;font-weight:600}
.lrow{display:grid;grid-template-columns:44px 48px 1fr 90px;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.lrow.first{background:linear-gradient(120deg,#5a4300,#8a5a00);border-color:#e0a000}
.lrow .rank{font-size:22px;font-weight:800;text-align:center}
.lrow .av{font-size:30px;text-align:center}
.lrow .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.lrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}
.lrow .xp{text-align:right;font-weight:800;font-size:18px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.badge .be{font-size:34px}
.badge b{display:block;margin-top:4px;font-size:14px}
.badge small{display:block;color:var(--mute);margin-top:2px;font-size:12px}
.badge.off{opacity:.4;filter:grayscale(1)}
/* player */
.player{display:flex;flex-direction:column;height:100%}
.pbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(10,15,40,.6);flex-wrap:wrap}
.ptitle{display:flex;flex-direction:column;min-width:140px}
.ptitle small{color:var(--mute)}
.phud{display:flex;gap:10px;margin-left:auto}
.hud{background:var(--card);border-radius:10px;padding:4px 12px;text-align:center;min-width:72px}
.hud span{display:block;font-size:11px;color:var(--mute)}
.hud b{font-size:18px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{background:transparent;border:0;padding:6px 12px;border-radius:8px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card2);color:#fff}
.stage{position:relative;flex:1 1 auto;min-height:300px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,25,.55);backdrop-filter:blur(2px);padding:12px;overflow:auto}
.overlay.hidden{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .sub{color:var(--mute);margin-bottom:14px;font-size:14px}
.opt{margin:12px 0}
.opt>label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:600}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{flex:1 1 150px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.choice b{display:block}
.choice small{color:var(--mute);font-size:12px}
.choice.on{border-color:var(--amber);background:#2b2f5e}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:16px}
select{background:var(--bg2);color:var(--ink);border:1px solid var(--line);padding:9px;border-radius:10px;width:100%;font-size:15px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--amber)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,6,20,.72);display:grid;place-items:center;z-index:50;padding:14px;overflow:auto}
#modal.hidden{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(540px,100%);max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox h2{margin-bottom:10px}
.emojis{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.emojis button{font-size:28px;width:52px;height:52px;border-radius:14px;background:var(--bg2);border:2px solid transparent}
.emojis button.on{border-color:var(--amber);background:#2b2f5e}
.plist button.p{display:flex;align-items:center;gap:12px;width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:17px;font-weight:700}
.plist button.p.on{border-color:var(--amber)}
.plist .e{font-size:30px}
.res{text-align:center}
.res .big{font-size:56px;letter-spacing:6px;margin:6px 0}
.res .big i{font-style:normal;color:#3a4585;display:inline-block}
.res .big i.on{color:var(--amber);text-shadow:0 0 18px rgba(255,176,32,.8);animation:pop .5s both}
.res .big i.on:nth-child(2){animation-delay:.2s}
.res .big i.on:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.rgrid div{background:var(--bg2);border-radius:12px;padding:10px}
.rgrid b{display:block;font-size:24px}
.rgrid span{font-size:12px;color:var(--mute)}
.xpgain{font-size:20px;font-weight:800;color:var(--green);margin:6px 0}
.newbadge{display:inline-flex;gap:8px;align-items:center;background:#3a2f00;border:1px solid #e0a000;padding:6px 12px;border-radius:999px;margin:4px;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#111a45;border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--mute)}
.mt{margin-top:14px}
.note-box{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);padding:10px 12px;border-radius:12px;font-size:14px;color:#ffe3a6}
@media (max-width:760px){
  nav button{padding:7px 9px;font-size:14px}
  .logo span{display:none}
  .lrow{grid-template-columns:34px 38px 1fr 70px}
}

.handpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.htile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center!important;padding:10px 8px!important;flex:none!important}
.htile svg{width:100%;height:auto;max-width:150px;display:block}
.htile b{font-size:14px}
.htile small{display:block}
.htile.on{box-shadow:0 0 0 3px rgba(255,176,32,.25)}
.shelf{margin:0 0 22px}
.shelf h2{font-size:18px;margin:0 0 4px}
.shelf .sub{color:var(--mute);font-size:13px;margin-bottom:10px}
.shelfrow{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.scard{flex:0 0 150px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.scard:hover{filter:brightness(1.15)}
.scard .em{font-size:38px;line-height:1}
.scard b{font-size:14px;line-height:1.2;min-height:34px;display:flex;align-items:center}
.scard .bstars{font-size:16px;letter-spacing:1px}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:160px;background:var(--bg2);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit}
.search:focus{outline:0;border-color:var(--amber)}
select.sel{background:var(--bg2);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 10px;font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:var(--card);border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
.tag.on{background:var(--amber);border-color:var(--amber);color:#2a1700}
.tag i{font-style:normal;opacity:.7;margin-left:4px;font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px;background:var(--card2);color:var(--mute)}
.pill.easy{background:#14532d;color:#86efac}.pill.medium{background:#713f12;color:#fde68a}.pill.hard{background:#7f1d1d;color:#fecaca}
.songlist{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.lrow .em{font-size:22px;width:30px;text-align:center}
.lrow .ti{flex:1;min-width:0}.lrow .ti b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ti small{color:var(--mute)}
.lrow .bstars{font-size:16px;white-space:nowrap}
.songcard .top{display:flex;gap:10px;align-items:flex-start}
.songcard .em{font-size:28px;line-height:1}
.dropzone.drag{outline:3px dashed var(--amber);outline-offset:6px}
.bt{width:100%;border-collapse:collapse;font-size:14px}
.bt td,.bt th{padding:4px 4px;text-align:left}
.bt input,.bt select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit}
.bt-wrap{max-height:50vh;overflow:auto;margin:10px 0}
.mbox.wide{max-width:760px;width:94vw}
@media(max-width:560px){.handpick{gap:6px}.htile b{font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">🎹 <span>Piano Quest</span></div>
    <nav id="nav">
      <button data-s="learn">Learn</button>
      <button data-s="songs">Songs</button>
      <button data-s="league">League</button>
      <button data-s="profile">Profile</button>
    </nav>
    <button class="chip" id="midiChip"><i class="dot"></i><span id="midiTxt">Piano: not connected</span></button>
    <button class="chip" id="profBtn">Who's playing?</button>
  </header>
  <main id="view"></main>
</div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Piano Quest: family piano learning app. Everything is stored locally
   in this browser (localStorage). No accounts, no server.
   ===================================================================== */

// ---------- helpers ----------
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => ymd(new Date());
function weekStart(d = new Date()) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return ymd(x);
}
function prevWeekStart() { const x = new Date(); x.setDate(x.getDate() - 7); return weekStart(x); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- music helpers ----------
const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const isBlack = p => [1,3,6,8,10].includes(p % 12);
const noteName = p => NOTE_NAMES[p % 12] + (Math.floor(p / 12) - 1);
function parseName(n) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
  if (!m) throw new Error('Bad note ' + n);
  return 12 * (parseInt(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const STEP_MAP = [0,0,1,1,2,3,3,4,4,5,5,6]; // sharps spelling
const stepOf = p => (Math.floor(p / 12) - 1) * 7 + STEP_MAP[p % 12];
function parseTrack(str, hand) {
  const out = []; let t = 0;
  for (const tok of (str || '').replace(/\|/g, ' ').split(/\s+/).filter(Boolean)) {
    const [n, d] = tok.split('/'); const dur = parseFloat(d);
    if (n === 'R') { t += dur; continue; }
    for (const nm of n.split('+')) out.push({ p: parseName(nm), start: t, dur, hand });
    t += dur;
  }
  return out;
}
const barBeats = s => s.ts[0] * 4 / s.ts[1];

// ---------- built-in songs ----------
const RAW = [
 {id:'middle-c',title:'Find Middle C',bpm:72,ts:[4,4],
  R:'C4/1 C4/1 C4/2 | C4/1 C4/1 C4/2 | C4/1 C4/1 C4/1 C4/1 | C4/4'},
 {id:'two-notes',title:'Two Notes',bpm:72,ts:[4,4],
  R:'C4/1 D4/1 C4/1 D4/1 | D4/1 C4/1 D4/2 | C4/2 D4/2 | C4/1 D4/1 C4/2'},
 {id:'three-notes',title:'Three Notes',bpm:76,ts:[4,4],
  R:'C4/1 D4/1 E4/1 D4/1 | C4/1 D4/1 E4/2 | E4/1 D4/1 C4/1 D4/1 | E4/1 D4/1 C4/2'},
 {id:'hot-cross',title:'Hot Cross Buns',bpm:84,ts:[4,4],
  R:'E4/1 D4/1 C4/2 | E4/1 D4/1 C4/2 | C4/.5 C4/.5 C4/.5 C4/.5 D4/.5 D4/.5 D4/.5 D4/.5 | E4/1 D4/1 C4/2'},
 {id:'mary',title:'Mary Had a Little Lamb',bpm:90,ts:[4,4],
  R:'E4/1 D4/1 C4/1 D4/1 | E4/1 E4/1 E4/2 | D4/1 D4/1 D4/2 | E4/1 G4/1 G4/2 | E4/1 D4/1 C4/1 D4/1 | E4/1 E4/1 E4/1 E4/1 | D4/1 D4/1 E4/1 D4/1 | C4/4'},
 {id:'twinkle',title:'Twinkle Twinkle Little Star',bpm:92,ts:[4,4],
  R:'C4/1 C4/1 G4/1 G4/1 | A4/1 A4/1 G4/2 | F4/1 F4/1 E4/1 E4/1 | D4/1 D4/1 C4/2 | G4/1 G4/1 F4/1 F4/1 | E4/1 E4/1 D4/2 | G4/1 G4/1 F4/1 F4/1 | E4/1 E4/1 D4/2 | C4/1 C4/1 G4/1 G4/1 | A4/1 A4/1 G4/2 | F4/1 F4/1 E4/1 E4/1 | D4/1 D4/1 C4/2'},
 {id:'ode',title:'Ode to Joy',bpm:96,ts:[4,4],
  R:'E4/1 E4/1 F4/1 G4/1 | G4/1 F4/1 E4/1 D4/1 | C4/1 C4/1 D4/1 E4/1 | E4/1.5 D4/.5 D4/2 | E4/1 E4/1 F4/1 G4/1 | G4/1 F4/1 E4/1 D4/1 | C4/1 C4/1 D4/1 E4/1 | D4/1.5 C4/.5 C4/2'},
 {id:'clair',title:'Au Clair de la Lune',bpm:88,ts:[4,4],
  R:'C4/1 C4/1 C4/1 D4/1 | E4/2 D4/2 | C4/1 E4/1 D4/1 D4/1 | C4/4'},
 {id:'jingle',title:'Jingle Bells (chorus)',bpm:112,ts:[4,4],

// ---------- MIDI file import ----------
function parseMidi(buf) {
  const d = new DataView(buf); let o = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(d.getUint8(o + i)); o += n; return s; };
  if (str(4) !== 'MThd') throw new Error('Not a MIDI file');
  const hl = d.getUint32(o); o += 4; const nt = d.getUint16(o + 2), div = d.getUint16(o + 4); o += hl;
  if (div & 0x8000) throw new Error('This MIDI timing format is not supported');
  let tempo = 500000, ts = [4, 4], tempoSet = false, tsSet = false; const tracks = [];
  for (let t = 0; t < nt && o + 8 <= d.byteLength; t++) {
    const id = str(4), len = d.getUint32(o); o += 4; const end = Math.min(o + len, d.byteLength);
    if (id !== 'MTrk') { o = end; continue; }
    let tick = 0, rs = 0, name = ''; const on = new Map(), notes = [];
    const vlq = () => { let v = 0, b; do { b = d.getUint8(o++); v = (v << 7) | (b & 0x7f); } while ((b & 0x80) && o < end); return v; };
    while (o < end) {
      tick += vlq(); let st = d.getUint8(o);
      if (st < 0x80) st = rs; else { o++; if (st < 0xf0) rs = st; }
      if (st === 0xff) {
        const type = d.getUint8(o++), l = vlq();
        if (type === 0x51 && l === 3 && !tempoSet) { tempo = (d.getUint8(o) << 16) | (d.getUint8(o + 1) << 8) | d.getUint8(o + 2); tempoSet = true; }
        else if (type === 0x58 && l >= 2 && !tsSet) { ts = [d.getUint8(o), Math.pow(2, d.getUint8(o + 1))]; tsSet = true; }
        else if (type === 0x03) { for (let i = 0; i < l; i++) name += String.fromCharCode(d.getUint8(o + i)); }
        o += l;
      } else if (st === 0xf0 || st === 0xf7) { o += vlq(); }
      else {
        const cmd = st & 0xf0, ch = st & 0x0f, a = d.getUint8(o++), b = (cmd === 0xc0 || cmd === 0xd0) ? 0 : d.getUint8(o++);
        if (ch === 9) continue;
        const key = ch * 128 + a;
        if (cmd === 0x90 && b > 0) { if (on.has(key)) { notes.push({ p: a, s: on.get(key), e: tick }); } on.set(key, tick); }
        else if (cmd === 0x80 || (cmd === 0x90 && b === 0)) { if (on.has(key)) { notes.push({ p: a, s: on.get(key), e: tick }); on.delete(key); } }
      }
    }
    o = end; if (notes.length) tracks.push({ name, notes });
  }
  return { ppq: div, bpm: clamp(Math.round(60e6 / tempo), 40, 200), ts, tracks };
}
function midiToNotes(buf) {
  const m = parseMidi(buf);
  if (!m.tracks.length) throw new Error('No notes found in that file');
  let all = [];
  const avg = t => t.notes.reduce((s, n) => s + n.p, 0) / t.notes.length;
  if (m.tracks.length === 2) { const [a, b] = avg(m.tracks[0]) >= avg(m.tracks[1]) ? [m.tracks[0], m.tracks[1]] : [m.tracks[1], m.tracks[0]]; a.notes.forEach(n => all.push({ ...n, r: 1 })); b.notes.forEach(n => all.push({ ...n, r: 0 })); }
  else m.tracks.forEach(t => t.notes.forEach(n => all.push({ ...n, r: n.p >= 60 ? 1 : 0 })));
  const q = x => Math.round(x * 96) / 96, bb = m.ts[0] * 4 / m.ts[1];
  all = all.map(n => [n.p, q(n.s / m.ppq), Math.max(.05, q((n.e - n.s) / m.ppq)), n.r]).filter(n => n[2] >= .05);
  const minS = Math.min(...all.map(n => n[1])), off = Math.floor(minS / bb) * bb;
  all.forEach(n => n[1] = q(n[1] - off));
  let trimmed = false; if (all.length > 4000) { all.sort((a, b) => a[1] - b[1]); all = all.slice(0, 4000); trimmed = true; }
  all.forEach(n => { n[1] = +n[1].toFixed(4); n[2] = +n[2].toFixed(4); });
  return { bpm: m.bpm, ts: m.ts, notes: all, trimmed };
}

// ---------- bundled library (songs/songs.json, loaded on demand) ----------
let LIB = [], LIBSTATE = 'loading';
function loadManifest() {
  fetch('songs.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(j => { LIB = j; LIBSTATE = 'ok'; if (screen === 'songs') renderSongs(); if (screen === 'learn') renderLearn(); })
    .catch(() => { LIBSTATE = 'none'; if (screen === 'songs') renderSongs(); });
}
async function loadLibSong(id) {
  const m = LIB.find(x => 'lib:' + x.f === id); if (!m) throw new Error('missing');
  const r = await fetch('songs/' + m.f); if (!r.ok) throw new Error('fetch');
  const n = midiToNotes(await r.arrayBuffer());
  SONGS[id] = finishSong({ id, title: m.t, artist: m.a, bpm: n.bpm, ts: n.ts, pickup: 0, lib: true,
    notes: n.notes.map(a => ({ p: a[0], start: a[1], dur: a[2], hand: a[3] ? 'R' : 'L' })) });
}

// ---------- one list of every song (built-in, library, yours) ----------
const LVL_ORDER = { easy: 0, medium: 1, hard: 2 };
function allItems() {
  const out = [];
  RAW.forEach(r => { const s = SONGS[r.id], m = BMETA[r.id] || { t: ['other'], e: '🎵' };
    out.push({ id: r.id, title: r.title, artist: '', tags: m.t, lvl: m.l || 'easy', kind: 'b', emoji: m.e, both: s.hasL && s.hasR, n: s.notes.length }); });
  LIB.forEach(m => out.push({ id: 'lib:' + m.f, title: m.t, artist: m.a, tags: m.tags, lvl: m.lvl, kind: 'l', emoji: '🎵', both: m.h === 'B', n: m.n }));
  DB.songs.forEach(c => out.push({ id: c.id, title: c.title, artist: c.artist || '', tags: ['mine', ...(c.tags || [])], lvl: c.lvl || 'medium', kind: 'c', emoji: '🎵',
    both: c.notes.some(n => n[3]) && c.notes.some(n => !n[3]), n: c.notes.length }));
  return out;
}
const songStars = (p, id) => (p.prog['song:' + id] && p.prog['song:' + id].stars) || 0;

// ---------- batch import ----------
function guessMeta(name) {
  let b = name.replace(/\.(mid|midi)$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  let artist = '', title = b;
  const m = b.match(/^(.+?)\s+-\s+(.+)$/);
  if (m) { artist = m[1].trim(); title = m[2].trim(); }
  else title = b.replace(/-/g, ' ').replace(/\s+/g, ' ');
  return { title: title.slice(0, 60), artist: artist.slice(0, 40) };
}
const catOptions = (sel) => CATS.filter(c => c[0] !== 'mine').map(c => `<option value="${c[0]}" ${c[0] === sel ? 'selected' : ''}>${esc(c[1])}</option>`).join('');
function openBatch(fileList) {
  const files = [...fileList].filter(f => /\.midi?$/i.test(f.name));
  if (!files.length) return toast('Pick some MIDI (.mid) files.');
  const rows = files.map(f => ({ f, ...guessMeta(f.name), cat: 'other' }));
  showModal(`<h2>Add ${rows.length} song${rows.length > 1 ? 's' : ''}</h2>
    <p class="muted" style="margin-top:4px">Check the names and pick a category. File names like <b>Artist - Title.mid</b> are split automatically.</p>
    <div class="row mt"><label class="muted">Category for all:</label><select class="sel" id="bAll"><option value="">Choose...</option>${catOptions('')}</select></div>
    <div class="bt-wrap"><table class="bt"><tr><th>Title</th><th>Artist</th><th>Category</th></tr>
    ${rows.map((r, i) => `<tr><td><input data-i="${i}" data-k="title" value="${esc(r.title)}"></td><td><input data-i="${i}" data-k="artist" value="${esc(r.artist)}"></td>
      <td><select data-i="${i}" data-k="cat">${catOptions(r.cat)}</select></td></tr>`).join('')}</table></div>
    <div id="bMsg" class="muted"></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" id="bCancel">Cancel</button><button class="btn primary" id="bGo">Add ${rows.length}</button></div>`, true);
  $('#modal .mbox').classList.add('wide');
  $$('#modal [data-k]').forEach(el => el.oninput = el.onchange = () => { rows[+el.dataset.i][el.dataset.k] = el.value; });
  $('#bAll').onchange = e => { if (!e.target.value) return; rows.forEach(r => r.cat = e.target.value); $$('#modal select[data-k=cat]').forEach(s => s.value = e.target.value); };
  $('#bCancel').onclick = closeModal;
  $('#bGo').onclick = async () => {
    $('#bGo').disabled = true; let ok = 0, bad = [], trimmed = 0;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i]; $('#bMsg').textContent = `Reading ${i + 1} of ${rows.length}...`;
      try {
        const n = midiToNotes(await r.f.arrayBuffer());
        const nps = n.notes.length / Math.max(1, Math.max(...n.notes.map(x => x[1] + x[2])) * 60 / n.bpm);
        DB.songs.push({ id: 'c' + Date.now().toString(36) + i, title: (r.title || r.f.name).trim(), artist: r.artist.trim(), tags: r.cat === 'other' ? [] : [r.cat],
          lvl: nps < 2.2 ? 'easy' : nps < 4.2 ? 'medium' : 'hard', bpm: n.bpm, ts: n.ts, notes: n.notes });
        ok++; if (n.trimmed) trimmed++;
      } catch (e) { bad.push(r.f.name); }
    }
    try { save(); } catch (e) { toast('Browser storage is full. Delete a few songs and try again.'); }
    loadCustomSongs(); closeModal();
    toast(`Added ${ok} song${ok === 1 ? '' : 's'}${bad.length ? `, ${bad.length} could not be read` : ''}${trimmed ? `, ${trimmed} long one${trimmed > 1 ? 's' : ''} trimmed` : ''}`);
    renderSongs();
  };
}
function editSong(id) {
  const c = DB.songs.find(s => s.id === id); if (!c) return;
  showModal(`<h2>Edit song</h2><div class="opt mt"><label>Title</label><input class="search" id="eT" value="${esc(c.title)}"></div>
    <div class="opt mt"><label>Artist</label><input class="search" id="eA" value="${esc(c.artist || '')}"></div>
    <div class="opt mt"><label>Category</label><select class="sel" id="eC">${catOptions((c.tags || [])[0] || 'other')}</select></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" id="eX">Cancel</button><button class="btn primary" id="eS">Save</button></div>`);
  $('#eX').onclick = closeModal;
  $('#eS').onclick = () => { c.title = $('#eT').value.trim() || c.title; c.artist = $('#eA').value.trim(); const k = $('#eC').value; c.tags = k === 'other' ? [] : [k];
    if (SONGS[id]) { SONGS[id].title = c.title; SONGS[id].artist = c.artist; } save(); closeModal(); renderSongs(); };
}
